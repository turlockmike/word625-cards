<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture Words has moved → Japanese Cards</title>
<!-- Consolidated 2026-07-23: word625 picture-cards now live inside the Kana app as the
     "Words" mode. This page redirects old bookmarks straight into Words mode. -->
<meta http-equiv="refresh" content="0; url=https://turlockmike.github.io/kana-cards/#words">
<link rel="canonical" href="https://turlockmike.github.io/kana-cards/#words">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f6f3ee;color:#242021;display:flex;min-height:100vh;margin:0;
       align-items:center;justify-content:center;text-align:center;padding:24px;}
  a{color:#e8734a;font-weight:700;}
</style>
</head>
<body>
  <div>
    <h2>Picture Words moved 🖼️→✍️</h2>
    <p>It's now the <b>Words</b> mode inside <b>Japanese Cards</b>.</p>
    <p><a id="go" href="https://turlockmike.github.io/kana-cards/#words">Open Japanese Cards →</a></p>
  </div>
  <script>
    // Belt-and-suspenders: unregister the old service worker so this redirect isn't
    // served stale from cache, then hard-navigate to the Words mode.
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
    }
    location.replace('https://turlockmike.github.io/kana-cards/#words');
  </script>
<script>window.FAM_USAGE_APP='word625';window.FAM_USAGE_ENDPOINT='https://darmousseh.com/api/usage';window.FAM_USAGE_WHO=function(){try{var m=JSON.parse(localStorage.getItem('w625_meta_v1'));var p=m.profiles.filter(function(p){return p.id===m.active})[0];return p?p.name:''}catch(e){return ''}};</script><script src="https://darmousseh.com/usage.js" defer></script>
</body>
</html>
